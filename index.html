  <style>
    :root[data-theme="dark"] {
      --bg: #0f172a;
      --card: #1e293b;
      --card-hover: #24344d;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-text: #082f49;
      --green: #22c55e;
      --red: #f87171;
      --border: #334155;
      --input-bg: #0b1220;
      --shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
      --overlay: rgba(15, 23, 42, 0.96);
    }

    :root[data-theme="light"] {
      --bg: #f8fafc;
      --card: #ffffff;
      --card-hover: #f1f5f9;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #0284c7;
      --accent-text: #ffffff;
      --green: #16a34a;
      --red: #dc2626;
      --border: #e2e8f0;
      --input-bg: #ffffff;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      --overlay: rgba(255, 255, 255, 0.98);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.2s ease, color 0.2s ease;
    }

    header {
      padding: 24px 16px 16px;
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
    }

    .header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.1;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.45;
    }

    /* Language Selector Styles */
    .lang-selector-wrap {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    select#langSelector {
      padding: 6px 10px;
      border-radius: 8px;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      cursor: pointer;
      font-size: 14px;
      outline: none;
    }
    
    select#langSelector:focus {
      border-color: var(--accent);
    }

    .icon-btn {
      flex: 0 0 auto;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform 0.15s ease, background 0.2s ease;
    }

    .icon-btn:hover {
      transform: translateY(-1px);
      background: var(--card-hover);
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 64px;
    }

    .search-wrap {
      position: relative;
      margin-bottom: 14px;
    }

    .search-input {
      width: 100%;
      border-radius: 14px;
      border: 1px solid var(--border);
      padding: 14px 16px;
      font-size: 16px;
      background: var(--input-bg);
      color: var(--text);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.14);
    }

    .suggestions {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      z-index: 30;
      background: var(--overlay);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      overflow: hidden;
      max-height: 360px;
      overflow-y: auto;
    }

    .suggestions[hidden] {
      display: none;
    }

    .suggestion {
      width: 100%;
      border: 0;
      border-bottom: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      padding: 12px 14px;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .suggestion:last-child {
      border-bottom: 0;
    }

    .suggestion:hover,
    .suggestion.active {
      background: var(--card-hover);
    }

    .suggestion-main {
      font-weight: 700;
    }

    .suggestion-meta {
      color: var(--muted);
      font-size: 13px;
    }

    .no-results {
      padding: 14px;
      color: var(--muted);
      font-size: 14px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 22px;
    }

    button {
      font-family: inherit;
    }

    .btn {
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 11px 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      background: var(--accent);
      color: var(--accent-text);
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .status {
      min-height: 20px;
      font-size: 14px;
      color: var(--muted);
    }

    .status.success {
      color: var(--green);
    }

    .status.error {
      color: var(--red);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    @media (max-width: 980px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .header-top {
        flex-direction: row;
      }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 190px;
      box-shadow: var(--shadow);
      transition: transform 0.18s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      background: var(--card-hover);
    }

    .city {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 4px;
      padding-right: 28px;
    }

    .zone {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 14px;
      word-break: break-word;
    }

    .time {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 0.5px;
      color: var(--green);
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }

    .date {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
    }

    .offset {
      margin-top: auto;
      align-self: flex-start;
      padding: 5px 9px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
    }

    .remove {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 28px;
      height: 28px;
      border-radius: 10px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .remove:hover {
      color: var(--red);
      background: rgba(248, 113, 113, 0.12);
    }

    .note {
      margin-top: 28px;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      line-height: 1.5;
    }

    footer {
      text-align: center;
      padding: 24px 16px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      font-size: 14px;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

        searchInput.addEventListener("blur", () => {
          setTimeout(hideSuggestions, 140);
        });

        searchInput.addEventListener("keydown", (event) => {
          if (event.key === "ArrowDown") {
            event.preventDefault();
            if (!suggestionItems.length) return;
            setActiveSuggestion(activeSuggestion + 1);
          }

          if (event.key === "ArrowUp") {
            event.preventDefault();
            if (!suggestionItems.length) return;
            setActiveSuggestion(activeSuggestion - 1);
          }

          if (event.key === "Enter") {
            event.preventDefault();
            if (activeSuggestion >= 0 && suggestionItems[activeSuggestion]) {
              const btn = suggestionItems[activeSuggestion];
              addCity(btn.dataset.label, btn.dataset.timezone);
              return;
            }
            handleAddButton();
          }

          if (event.key === "Escape") {
            hideSuggestions();
          }

    function getTranslatedCityLabel(originalLabel, timezone) {
        // Helper to find if a standard city has a translation in current language
        // This is a simplified mapping. In a real app, you'd have a massive dictionary.
        // Here we just check against known keys in DEFAULT_CITIES_LABELS array order vs BASE_DEFAULT_CITIES
        
        const t = translations[currentLang];
        if(!t || !t.default_cities_labels) return originalLabel;

        // Check if this city is one of the default 9 by matching timezone roughly or index logic
        // Since user might add custom cities, we only translate the core ones if possible.
        // For this demo, we rely on the fact that renderClocks uses the stored label.
        // If we want dynamic translation of STORED labels, we need to map them back.
        // However, storing the LABEL in localStorage means if I switch language, old cities stay in old language.
        // BETTER APPROACH: Store only TIMEZONE in localStorage, derive Label at Render time.
        // BUT, your existing code stores {label, timezone}. 
        // To fix this properly without breaking everything:
        // We will re-map the labels during render IF they match known defaults.
        
        // Let's implement a lookup for the Default 9 cities specifically.
        const defaultMap = {};
        BASE_DEFAULT_CITIES.forEach((base, i) => {
             if(t.default_cities_labels[i]) {
                 defaultMap[base.timezone] = t.default_cities_labels[i];
             }
        });
        
        return defaultMap[timezone] || originalLabel;
    }

    function loadCities() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length > 0) {
            return parsed.filter((city) => city && city.timezone && city.label);
          }
        }
      } catch (error) {
        console.warn("Failed to load cities:", error);
      }
      // Return defaults mapped to current language
      const t = translations[currentLang];
      return BASE_DEFAULT_CITIES.map((base, i) => ({
         ...base,
         label: t.default_cities_labels[i] || base.label
      }));
    }

    function saveCities() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cities));
    }

    function isValidTimezone(timezone) {
      try {
        new Intl.DateTimeFormat("en-US", { timeZone: timezone });
        return true;
      } catch (error) {
        return false;
      }
    }

    function isCityAdded(label, timezone) {
      return cities.some(
        (city) => city.timezone === timezone // Match primarily by timezone to avoid duplicates due to translation differences
      );
    }

    function labelFromTimezone(timezone) {
      const parts = timezone.split("/");
      const last = parts[parts.length - 1] || timezone;
      return last.replace(/_/g, " ");
    }

    function addCity(label, timezone) {
      if (!label || !timezone) return;

      if (!isValidTimezone(timezone)) {
        setStatus(translations[currentLang].status_invalid_tz, "error");
        return;
      }

      if (isCityAdded(label, timezone)) {
        setStatus(translations[currentLang].status_exists, "error");
        hideSuggestions();
        return;
      }

      cities.push({ label, timezone });
      saveCities();
      renderClocks();
      searchInput.value = "";
      hideSuggestions();
      setStatus(translations[currentLang].status_added, "success");
    }

    function removeCity(index) {
      if (index < 0 || index >= cities.length) return;
      cities.splice(index, 1);
      saveCities();
      renderClocks();
      setStatus(translations[currentLang].status_removed, "success");
    }

    function handleAddButton() {
      const value = searchInput.value.trim();
      const t = translations[currentLang];

      if (!value) {
        setStatus(t.status_empty_search, "error");
        searchInput.focus();
        return;
      }

      const exactCatalogMatch = CITY_CATALOG.find(
        (city) =>
          city.label.toLowerCase() === value.toLowerCase() ||
          city.timezone.toLowerCase() === value.toLowerCase()
      );

      if (exactCatalogMatch) {
        // Use the catalog label (usually English) but we could try to localize it here if complex
        // For now, adding the English label is safest for consistency, 
        // unless it's a default city which gets handled by render logic below.
        addCity(exactCatalogMatch.label, exactCatalogMatch.timezone);
        return;
      }

      if (isValidTimezone(value)) {
        addCity(labelFromTimezone(value), value);
        return;
      }

      setStatus(t.status_not_found, "error");
    }

    function renderSuggestions(query) {
      const normalized = query.trim().toLowerCase();
      suggestionItems = [];
      activeSuggestion = -1;
      suggestionsBox.innerHTML = "";

      if (!normalized) {
        hideSuggestions();
        return;
      }

      const matches = CITY_CATALOG.filter((city) => {
        if (isCityAdded(city.label, city.timezone)) return false;

        return (
          city.label.toLowerCase().includes(normalized) ||
          city.timezone.toLowerCase().includes(normalized) ||
          (city.country || "").toLowerCase().includes(normalized)
        );
      }).slice(0, 12);

      matches.forEach((city) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "suggestion";
        btn.dataset.label = city.label;
        btn.dataset.timezone = city.timezone;

        btn.innerHTML = `
          <span class="suggestion-main">${escapeHtml(city.label)}</span>
          <span class="suggestion-meta">
            ${escapeHtml(city.timezone)}${city.country ? " · " + escapeHtml(city.country) : ""}
          </span>
        `;

        suggestionsBox.appendChild(btn);
        suggestionItems.push(btn);
      });

      if (
        isValidTimezone(normalized) &&
        !cities.some((city) => city.timezone === normalized)
      ) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "suggestion";
        btn.dataset.label = labelFromTimezone(normalized);
        btn.dataset.timezone = normalized;

        btn.innerHTML = `
          <span class="suggestion-main">${translations[currentLang].btn_add}</span>
          <span class="suggestion-meta">${escapeHtml(normalized)}</span>
        `;

        suggestionsBox.appendChild(btn);
        suggestionItems.push(btn);
      }

      if (suggestionItems.length) {
        suggestionsBox.hidden = false;
        setActiveSuggestion(0);
      } else {
        suggestionsBox.innerHTML = `
          <div class="no-results">
            ${translations[currentLang].status_not_found}
          </div>
        `;
        suggestionsBox.hidden = false;
      }
    }

    function setActiveSuggestion(index) {
      suggestionItems.forEach((item) => item.classList.remove("active"));
      if (!suggestionItems.length) {
        activeSuggestion = -1;
        return;
      }
      let next = index;
      if (next < 0) next = suggestionItems.length - 1;
      if (next >= suggestionItems.length) next = 0;
      activeSuggestion = next;
      suggestionItems[activeSuggestion].classList.add("active");
      suggestionItems[activeSuggestion].scrollIntoView({ block: "nearest" });
    }

    function hideSuggestions() {
      suggestionsBox.hidden = true;
      suggestionsBox.innerHTML = "";
      suggestionItems = [];
      activeSuggestion = -1;
    }

    function renderClocks() {
      clocksContainer.innerHTML = "";
      const t = translations[currentLang];

      cities.forEach((city, index) => {
        const card = document.createElement("article");
        card.className = "card";
        card.dataset.timezone = city.timezone;

        // Determine Display Label:
        // 1. If it's one of the default 9, use the translated label from current dictionary.
        // 2. Otherwise, use the stored label (which might be English from catalog).
        let displayLabel = city.label;
        const defaultIdx = BASE_DEFAULT_CITIES.findIndex(b => b.timezone === city.timezone);
        if(defaultIdx !== -1 && t.default_cities_labels[defaultIdx]) {
            displayLabel = t.default_cities_labels[defaultIdx];
        }

        card.innerHTML = `
          <button
            class="remove"
            type="button"
            data-remove-index="${index}"
            aria-label="Remove ${escapeHtml(displayLabel)}"
            title="Remove"
          >
            ×
          </button>

          <div class="city">${escapeHtml(displayLabel)}</div>
          <div class="zone">${escapeHtml(city.timezone)}</div>
          <div class="time" data-time>--:--:--</div>
          <div class="date" data-date>Loading...</div>
          <div class="offset" data-offset>UTC</div>
        `;

        clocksContainer.appendChild(card);
      });

      updateTimes();
    }

    function updateTimes() {
      const now = new Date();
      const cards = document.querySelectorAll("#clocks .card");
      
      // Format locale depends on selected language
      const localeMap = {
          en: 'en-US',
          ru: 'ru-RU',
          zh: 'zh-CN',
          es: 'es-ES',
          hi: 'hi-IN'
      };
      const locale = localeMap[currentLang] || 'en-US';

      cards.forEach((card) => {
        const timezone = card.dataset.timezone;
        const timeEl = card.querySelector("[data-time]");
        const dateEl = card.querySelector("[data-date]");
        const offsetEl = card.querySelector("[data-offset]");

        if (timeEl) timeEl.textContent = formatTime(now, timezone, locale);
        if (dateEl) dateEl.textContent = formatDate(now, timezone, locale);
        if (offsetEl) offsetEl.textContent = getOffsetLabel(now, timezone);
      });
    }

    function formatTime(date, timezone, locale) {
      return new Intl.DateTimeFormat(locale, {
        timeZone: timezone,
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }).format(date);
    }

    function formatDate(date, timezone, locale) {
      return new Intl.DateTimeFormat(locale, {
        timeZone: timezone,
        weekday: "short",
        day: "numeric",
        month: "long",
        year: "numeric"
      }).format(date);
    }

    function getOffsetLabel(date, timezone) {
      try {
        const parts = new Intl.DateTimeFormat("en-US", {
          timeZone: timezone,
          timeZoneName: "shortOffset"
        }).formatToParts(date);
        const tzPart = parts.find((part) => part.type === "timeZoneName");
        return tzPart ? tzPart.value : "UTC";
      } catch (error) {
        return "UTC";
      }
    }

    function setStatus(message, type = "") {
      statusEl.textContent = message;
      statusEl.className = `status ${type}`.trim();
      clearTimeout(statusTimer);
      statusTimer = setTimeout(() => {
        statusEl.textContent = "";
        statusEl.className = "status";
      }, 2800);
    }

    function initTheme() {
      const savedTheme = localStorage.getItem(THEME_KEY);
      const systemPrefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
      const theme = savedTheme || (systemPrefersLight ? "light" : "dark");
      setTheme(theme);
    }

    function setTheme(theme) {
      document.documentElement.dataset.theme = theme;
      localStorage.setItem(THEME_KEY, theme);
      themeToggle.textContent = theme === "dark" ? "☀️" : "🌙";
      themeToggle.setAttribute("aria-label", theme === "dark" ? "Enable Light Mode" : "Enable Dark Mode");
      const metaThemeColor = document.querySelector('meta[name="theme-color"]');
      if (metaThemeColor) {
        metaThemeColor.setAttribute("content", theme === "dark" ? "#0f172a" : "#f8fafc");
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
